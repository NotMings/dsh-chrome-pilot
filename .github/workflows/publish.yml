name: publish

# Tag a release and this publishes it. The package must already exist on npm:
# npm cannot attach a trusted publisher to a package that has never been
# published, so the very first version goes out manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: node --check index.js && node --check client.js

      # Trusted publishing: no token in the repository, npm verifies this
      # workflow through OIDC. If you have not configured it yet, uncomment the
      # NODE_AUTH_TOKEN line and add an NPM_TOKEN secret instead.
      - run: npm publish --provenance --access public
        env:
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
